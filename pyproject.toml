[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-bot-aggregator"
version = "0.1.0"
description = "Local async FastAPI service for Telegram bot sending, MCP, and analytics."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "httpx>=0.27",
  "redis>=5.0",
  "taskiq>=0.11",
  "taskiq-redis>=1.0",
  "telethon>=1.36",
  "mcp>=1.8",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "anyio>=4.6",
  "ruff>=0.8",
]

[project.scripts]
tg-bot-aggregator = "tg_bot_aggregator.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tg_bot_aggregator = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

