services:
  app:
    build: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn tg_bot_aggregator.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app-data:/data
      - /mnt/omw-media:/shared/media:ro
    depends_on:
      - redis
      - telegram-bot-api

  worker:
    build: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    command: ["taskiq", "worker", "tg_bot_aggregator.tasks:broker", "tg_bot_aggregator.tasks"]
    volumes:
      - app-data:/data
      - /mnt/omw-media:/shared/media:ro
    depends_on:
      - redis
      - telegram-bot-api

  scheduler:
    build: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    command: ["python", "-m", "tg_bot_aggregator.scheduler"]
    depends_on:
      - redis

  diagnostic-bot:
    build: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    command: ["python", "-m", "tg_bot_aggregator.diagnostics.bot"]
    volumes:
      - app-data:/data
    depends_on:
      - telegram-bot-api

  discovery-bot:
    build: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    command: ["python", "-m", "tg_bot_aggregator.discovery.bot"]
    volumes:
      - app-data:/data
    depends_on:
      - telegram-bot-api

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - /mnt/omw-media:/shared/media:ro
    ports:
      - "8081:8081"

volumes:
  app-data:
  telegram-bot-api-data:
