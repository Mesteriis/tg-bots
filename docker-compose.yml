services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: "0.0.0.0"
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081
      SHARED_MEDIA_ROOT: /shared/media
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app-data:/data
      - /mnt/omw-media:/shared/media:ro
    depends_on:
      - redis
      - telegram-bot-api

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["taskiq", "worker", "tg_bot_aggregator.tasks:broker", "tg_bot_aggregator.tasks"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081
      SHARED_MEDIA_ROOT: /shared/media
    volumes:
      - app-data:/data
      - /mnt/omw-media:/shared/media:ro
    depends_on:
      - redis

  scheduler:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "tg_bot_aggregator.scheduler"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_INTERVAL_SECONDS: "3600"
    depends_on:
      - redis

  diagnostic-bot:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "tg_bot_aggregator.domain.diagnostics.bot"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081
      DIAGNOSTIC_POLL_TIMEOUT_SECONDS: "${DIAGNOSTIC_POLL_TIMEOUT_SECONDS:-30}"
      DIAGNOSTIC_RETRY_DELAY_SECONDS: "${DIAGNOSTIC_RETRY_DELAY_SECONDS:-5}"
    volumes:
      - app-data:/data
    depends_on:
      - telegram-bot-api

  discovery-bot:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "tg_bot_aggregator.domain.discovery.bot"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081
      DISCOVERY_POLL_TIMEOUT_SECONDS: "${DISCOVERY_POLL_TIMEOUT_SECONDS:-30}"
      DISCOVERY_RETRY_DELAY_SECONDS: "${DISCOVERY_RETRY_DELAY_SECONDS:-5}"
    volumes:
      - app-data:/data
    depends_on:
      - telegram-bot-api

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - /mnt/omw-media:/shared/media:ro
    ports:
      - "8081:8081"

volumes:
  app-data:
  telegram-bot-api-data:
