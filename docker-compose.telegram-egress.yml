services:
  telegram-egress:
    image: qmcgaw/gluetun:v3.41.1
    hostname: telegram-egress
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    entrypoint: ["/bin/sh", "/gluetun-wrapper.sh"]
    environment:
      TELEGRAM_EGRESS_STATE_DIR: /data/telegram-egress
      TELEGRAM_EGRESS_PROVIDER: "${TELEGRAM_EGRESS_PROVIDER:-wireguard}"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"none"}'
    ports:
      - "${APP_PORT:-8000}:8001"
    volumes:
      - app-data:/data
      - /mnt/omw-media:/shared/media:ro
      - ./deploy/telegram-egress/gluetun-wrapper.sh:/gluetun-wrapper.sh:ro

  app:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "tg_bot_aggregator.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8001"
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_API_BASE_URL: http://127.0.0.1:8081
      TELEGRAM_EGRESS_MODE: "${TELEGRAM_EGRESS_MODE:-wireguard}"
      TELEGRAM_EGRESS_ENABLED: "${TELEGRAM_EGRESS_ENABLED:-true}"
      TELEGRAM_EGRESS_PROVIDER: "${TELEGRAM_EGRESS_PROVIDER:-wireguard}"
      TELEGRAM_EGRESS_STATE_DIR: /data/telegram-egress
      TELEGRAM_EGRESS_CONTROL_URL: http://127.0.0.1:8000
      SHARED_MEDIA_ROOT: /shared/media
    network_mode: "service:telegram-egress"
    volumes:
      - app-data:/data
      - /mnt/omw-media:/shared/media:ro
    depends_on:
      - telegram-egress
      - redis
      - telegram-bot-api

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["taskiq", "worker", "tg_bot_aggregator.tasks:broker", "tg_bot_aggregator.tasks"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_API_BASE_URL: http://127.0.0.1:8081
      TELEGRAM_EGRESS_MODE: "${TELEGRAM_EGRESS_MODE:-wireguard}"
      TELEGRAM_EGRESS_ENABLED: "${TELEGRAM_EGRESS_ENABLED:-true}"
      TELEGRAM_EGRESS_PROVIDER: "${TELEGRAM_EGRESS_PROVIDER:-wireguard}"
      TELEGRAM_EGRESS_STATE_DIR: /data/telegram-egress
      TELEGRAM_EGRESS_CONTROL_URL: http://127.0.0.1:8000
      SHARED_MEDIA_ROOT: /shared/media
    network_mode: "service:telegram-egress"
    volumes:
      - app-data:/data
      - /mnt/omw-media:/shared/media:ro
    depends_on:
      - telegram-egress
      - redis
      - telegram-bot-api

  scheduler:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "tg_bot_aggregator.scheduler"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_INTERVAL_SECONDS: "3600"
    depends_on:
      - redis

  diagnostic-bot:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "tg_bot_aggregator.domain.diagnostics.bot"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      TELEGRAM_BOT_API_BASE_URL: http://127.0.0.1:8081
      TELEGRAM_EGRESS_MODE: "${TELEGRAM_EGRESS_MODE:-wireguard}"
      TELEGRAM_EGRESS_ENABLED: "${TELEGRAM_EGRESS_ENABLED:-true}"
      TELEGRAM_EGRESS_PROVIDER: "${TELEGRAM_EGRESS_PROVIDER:-wireguard}"
      TELEGRAM_EGRESS_STATE_DIR: /data/telegram-egress
      TELEGRAM_EGRESS_CONTROL_URL: http://127.0.0.1:8000
      DIAGNOSTIC_POLL_TIMEOUT_SECONDS: "${DIAGNOSTIC_POLL_TIMEOUT_SECONDS:-30}"
      DIAGNOSTIC_RETRY_DELAY_SECONDS: "${DIAGNOSTIC_RETRY_DELAY_SECONDS:-5}"
    network_mode: "service:telegram-egress"
    volumes:
      - app-data:/data
    depends_on:
      - telegram-egress
      - telegram-bot-api

  discovery-bot:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "tg_bot_aggregator.domain.discovery.bot"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      TELEGRAM_BOT_API_BASE_URL: http://127.0.0.1:8081
      TELEGRAM_EGRESS_MODE: "${TELEGRAM_EGRESS_MODE:-wireguard}"
      TELEGRAM_EGRESS_ENABLED: "${TELEGRAM_EGRESS_ENABLED:-true}"
      TELEGRAM_EGRESS_PROVIDER: "${TELEGRAM_EGRESS_PROVIDER:-wireguard}"
      TELEGRAM_EGRESS_STATE_DIR: /data/telegram-egress
      TELEGRAM_EGRESS_CONTROL_URL: http://127.0.0.1:8000
      DISCOVERY_POLL_TIMEOUT_SECONDS: "${DISCOVERY_POLL_TIMEOUT_SECONDS:-30}"
      DISCOVERY_RETRY_DELAY_SECONDS: "${DISCOVERY_RETRY_DELAY_SECONDS:-5}"
    network_mode: "service:telegram-egress"
    volumes:
      - app-data:/data
    depends_on:
      - telegram-egress
      - telegram-bot-api

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"
    network_mode: "service:telegram-egress"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - /mnt/omw-media:/shared/media:ro
    depends_on:
      - telegram-egress

volumes:
  app-data:
  telegram-bot-api-data:
